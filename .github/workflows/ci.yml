name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: airealtime
          POSTGRES_PASSWORD: airealtime
          POSTGRES_DB: airealtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airealtime"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AI_REALTIME_DATABASE_URL: postgresql+psycopg://airealtime:airealtime@localhost:5432/airealtime
      AI_REALTIME_QUEUE_BACKEND: memory
      AI_REALTIME_RATE_LIMIT_ENABLED: "false"
      AI_REALTIME_NER_ENABLED: "false"
      AI_REALTIME_EMBEDDING_ENABLED: "false"
      AI_REALTIME_CONVERSION_USE_DOCLING: "false"
      AI_REALTIME_CROSSENCODER_ENABLED: "false"
      AI_REALTIME_JWT_SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr libgl1 libglib2.0-0
      - name: Install Python deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --default-timeout=600 \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.5.1 torchvision==0.20.1
          pip install --default-timeout=600 -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Alembic migration drift check (non-blocking)
        working-directory: backend
        # Catches exactly the mistake that caused a real production outage
        # on 2026-09-14: a model column (JobDocument.scoring_profile) added
        # without a matching migration, deployed, and only failing once a
        # real request hit the DB. `alembic check` compares the migrated
        # schema (fresh `upgrade head` on the empty CI postgres service,
        # BEFORE pytest's own fixtures touch it) against current models.py
        # and fails if they've diverged -- i.e. "you forgot a migration".
        #
        # Non-blocking (|| true) for now: this repo has real PRE-EXISTING
        # drift accumulated over many past migrations (NOT NULL constraints,
        # FK/index naming) unrelated to any single recent change -- making
        # this blocking today would fail CI on every future PR for reasons
        # nobody caused just now. Making it blocking requires first writing
        # a dedicated cleanup migration for that backlog (a separate, higher-
        # risk change against the live schema -- do not attempt casually).
        # Until then, read this step's output on every run: a NEW mismatch
        # appearing here (beyond the known pre-existing list) most likely
        # means a migration is missing for a just-added model change.
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini check || echo "::warning::Alembic drift detected (see above) -- non-blocking, but check whether it's a NEW mismatch from this PR before merging"
      - name: Run pytest
        working-directory: backend
        run: pytest tests -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Ruff check (non-blocking)
        run: ruff check backend/app backend/tests agent || true
      - name: Ruff format check (non-blocking)
        run: ruff format --check backend/app backend/tests agent || true

  deploy:
    needs: backend-tests
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur le serveur
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: echo "déclenchement du déploiement"
