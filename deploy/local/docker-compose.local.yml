services:
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: airealtime-api
    environment:
      AI_REALTIME_ENVIRONMENT: docker-local
      AI_REALTIME_DATABASE_URL: postgresql+psycopg://airealtime:airealtime@postgres:5432/airealtime
      AI_REALTIME_REDIS_URL: redis://redis:6379/0
      AI_REALTIME_WATCH_CV_DIR: /srv/ai-realtime/storage/cv
      AI_REALTIME_WATCH_JOB_DIR: /srv/ai-realtime/storage/job
      AI_REALTIME_LOG_LEVEL: INFO
      AI_REALTIME_LOG_JSON: "false"
      AI_REALTIME_DATABASE_AUTO_CREATE: "true"
      AI_REALTIME_CORS_ALLOW_ORIGINS: "*"
      AI_REALTIME_JWT_SECRET_KEY: "local-dev-secret-key-change-in-production"
    ports:
      - "8000:8000"
    volumes:
      - ../../backend/app:/app/app
      - ../../storage/cv:/srv/ai-realtime/storage/cv
      - ../../storage/job:/srv/ai-realtime/storage/job
      - ../../storage/archive:/srv/ai-realtime/storage/archive
      # ESCO taxonomy CSVs are baked into the image; the named volume
      # preserves them across container rebuilds and lets you replace
      # skills_fr.csv / skills_en.csv manually via docker cp if needed.
      - airealtime_esco:/srv/ai-realtime/esco
      # scoring_v2 GBM model artifacts (trained pickle persists here).
      - airealtime_models:/srv/ai-realtime/models
      - airealtime_hf_cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\").read()'" ]
      interval: 10s
      timeout: 3s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    container_name: airealtime-postgres
    environment:
      POSTGRES_DB: airealtime
      POSTGRES_USER: airealtime
      POSTGRES_PASSWORD: airealtime
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airealtime -d airealtime"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: airealtime-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  airealtime_esco:
  airealtime_models:
  airealtime_hf_cache:
